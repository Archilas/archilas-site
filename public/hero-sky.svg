<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" preserveAspectRatio="xMidYMin slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3F73B8"/>
      <stop offset="36%" stop-color="#7BA8DC"/>
      <stop offset="66%" stop-color="#C8DDF2"/>
      <stop offset="100%" stop-color="#F2F6FA"/>
    </linearGradient>
    <filter id="cumulus" x="-15%" y="-25%" width="130%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.028" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="22" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="820" fill="url(#sky)"/>
  <circle cx="1090" cy="118" r="210" fill="url(#sun)"/>
  <g filter="url(#cumulus)" fill="#ffffff">
    <g opacity="0.92" transform="translate(40 70)">
      <ellipse cx="90" cy="70" rx="110" ry="42"/>
